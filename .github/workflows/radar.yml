name: Policy Pulse

on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 09:00 IST — ingest, score, build, deploy, post digest
    - cron: "0 4 * * *"    # daily 09:30 IST — Citizen's Corner + deadline reminders
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["radar/**", "data/*.json", "requirements.txt", ".github/workflows/radar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: policy-pulse
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  POLICY_PULSE_CHANNEL_URL: ${{ vars.POLICY_PULSE_CHANNEL_URL }}
  POLICY_PULSE_SITE_URL: ${{ vars.POLICY_PULSE_SITE_URL }}
  REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
  REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
  REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest, enrich, cross-check, build
        if: github.event.schedule != '0 4 * * *'
        run: python -m radar run --months 18
      - name: Daily public discussion sample and deadlines
        if: github.event.schedule == '0 4 * * *'
        run: |
          python -m radar citizens
          python -m radar notify --pings
          python -m radar build
      - name: Post weekly digest + any deadline pings
        if: github.event.schedule != '0 4 * * *'
        run: python -m radar notify --digest --pings
      - name: Commit data + site
        run: |
          git config user.name "policy-pulse-bot"
          git config user.email "policy-pulse-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: weekly Policy Pulse update $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

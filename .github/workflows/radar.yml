name: Policy Pulse

on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 09:00 IST — ingest, score, build, deploy, post digest
    - cron: "0 4 * * *"    # daily 09:30 IST — Citizen's Corner + deadline reminders
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Refresh external sources before deployment (otherwise build the saved snapshot)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["radar/**", "tests/**", "data/*.json", "data/radar.sqlite", "docs/**", "requirements.txt", ".github/workflows/radar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: policy-pulse
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  POLICY_PULSE_CHANNEL_URL: ${{ vars.POLICY_PULSE_CHANNEL_URL }}
  POLICY_PULSE_SITE_URL: ${{ vars.POLICY_PULSE_SITE_URL }}
  REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
  REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
  REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: Collect and publish source health (no model required)
        id: collect
        if: github.event_name == 'schedule' || inputs.refresh_sources == true
        continue-on-error: true
        env:
          DAILY: ${{ github.event.schedule == '0 4 * * *' }}
          ANTHROPIC_API_KEY: ""
        run: |
          if [ "$DAILY" = "true" ]; then
            python -m radar collect --daily
          else
            python -m radar collect --months 18
          fi
      - name: Verify generated health and save workflow summary
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          python -m radar build
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("docs/health.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Source collection health\n\n")
              out.write("| Source | Last result | Stale | Last complete collection |\n|---|---|---|---|\n")
              for row in report["sources"]:
                  out.write(f"| {row['source']} | {row['status']} | {row['stale']} | {row['successful_at'] or 'Never'} |\n")
          PY
      - name: Commit data + site
        run: |
          git config user.name "policy-pulse-bot"
          git config user.email "policy-pulse-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: Policy Pulse collection $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
    outputs:
      collection: ${{ steps.collect.outcome }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report-failures:
    needs: [publish, deploy]
    if: always() && needs.publish.outputs.collection == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Collection was incomplete. Inspect the source health report and collection logs; the last available data remains visible."
          exit 1

  notify:
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest or deadline reminders
        env:
          DAILY: ${{ github.event.schedule == '0 4 * * *' }}
        run: |
          if [ "$DAILY" = "true" ]; then
            python -m radar notify --pings
          else
            python -m radar notify --digest --pings
          fi
      - name: Save notification receipts
        if: always()
        run: |
          git config user.name "policy-pulse-bot"
          git config user.email "policy-pulse-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: notification receipts $(date -u +%F)"
          git push
